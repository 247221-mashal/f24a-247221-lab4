<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supermarket — Sheet</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
    <h1>Supermarket</h1>
    <nav>
        <a href="index.html">Sheet</a>
        <a href="till.html">Till</a>
        <a href="who_is_in.html">Who is in</a>
    </nav>
</header>

<div class="container">
    <h2>Shop Sheet</h2>

    <table id="sheet-table">
        <thead>
            <tr>
                <th>Item</th>
                <th>Quantity</th>
                <th>Price</th>
                <th>Line</th>
                <th>Note</th>
            </tr>
        </thead>
        <tbody id="table-body">
            <!-- Dynamic rows injected here by script.js -->
        </tbody>
    </table>

    <form id="item-form">
        <input type="text" id="item-box" placeholder="Item" required>
        <input type="number" id="quantity-box" placeholder="Quantity" step="any" required>
        <input type="number" id="price-box" placeholder="Price" step="any" required>
        <button type="button" id="add-btn">Add</button>
    </form>
    
    <div class="info-section">
        <p><strong>Total:</strong> <span id="total-val">0</span></p>
        <p><strong>Kind of Total:</strong> <span id="total-kind">-</span></p>
        <p><strong>Kind of Note (Just Added):</strong> <span id="note-kind">-</span></p>
        <p><strong>Does price text match price as a number (==)?</strong> <span id="match-val">-</span></p>
        <p><strong>Are price text and price number same kind (===)?</strong> <span id="strict-match-val">-</span></p>
        <p><strong>Kind of Line (if NaN):</strong> <span id="nan-kind">-</span></p>
    </div>
</div>

<footer>
    Roll Number: F24A-247221
</footer>

<script src="script.js"></script>
</body>
</html>
